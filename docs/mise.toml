[tools]
"pipx:zensical" = "0.0.43"
pandoc = "3.9.0.2"

[tasks.build]
description = "Build and validate the Zensical documentation"
depends = ["//docs:generated-docs"]
run = '''
printf 'cwd: %s\n' "$(pwd)"
zensical build --strict
if [ -n "${LOCALCI_TASK_OUTPUT_DIR:-}" ]; then
  artifact_site="$LOCALCI_TASK_OUTPUT_DIR/site"
  rm -rf "$artifact_site"
  mkdir -p "$artifact_site"
  cp -R site/. "$artifact_site/"
fi
'''

[tasks.serve]
description = "Serve the Zensical documentation"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "zensical serve",
]

[tasks."localci:build"]
description = "Build and validate the Zensical documentation"
run = "mise run //docs:build"

[tasks.generated-docs]
description = "Generate CLI reference pages and bundled terminal docs"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "go run ../cmd/localci-docs --cli-out src/cli --bundle-out ../internal/docs/generated --source src --filter pandoc/zensical-admonitions.lua --changelog-in ../CHANGELOG.md --changelog-out src/changelog.md",
]

[tools]
"pipx:zensical" = "0.0.43"
pandoc = "3.9.0.2"

[tasks.build]
description = "Build and validate the Zensical documentation"
depends = ["//docs:generate"]
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "zensical build --strict",
]

[tasks.generate]
description = "Generate checked-in documentation artifacts"
run = '''
printf 'cwd: %s\n' "$(pwd)"
go run ../cmd/localci-docs --cli-out src/cli --bundle-out ../internal/docs/generated --source src --filter pandoc/zensical-admonitions.lua --changelog-in ../CHANGELOG.md --changelog-out src/changelog.md
'''

[tasks.serve]
description = "Serve the Zensical documentation"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "zensical serve",
]

[tasks."localci:build"]
description = "Build and validate the Zensical documentation"
depends = ["//docs:build"]
run = '''
artifact_site="${LOCALCI_TASK_OUTPUT_DIR:?LOCALCI_TASK_OUTPUT_DIR is required}/site"
rm -rf "$artifact_site"
mkdir -p "$artifact_site"
cp -R site/. "$artifact_site/"
cat >"${LOCALCI_TASK_ARTIFACTS_FILE:?LOCALCI_TASK_ARTIFACTS_FILE is required}" <<'JSON'
{
  "version": 1,
  "artifacts": [
    {"name": "docs html", "path": "site/index.html", "action": "open"}
  ]
}
JSON
'''

experimental_monorepo_root = true

[env]
GOCACHE = "{{config_root}}/.cache/go-build"

[monorepo]
config_roots = ["web", "docs", "packages/localci-demo-core", "packages/localci-demo-ui"]

[tools]
"aqua:terrastruct/d2" = "0.7.1"
go = "1.26.3"
node = "24.11.0"
pnpm = "11.2.2"

[tasks.build]
description = "Build the localci binary"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "go build -o ./bin/localci ./cmd/localci",
]

[tasks.web-build]
description = "Build the Vue UI"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "pnpm --dir web run build-only",
]

[tasks."localci:setup"]
description = "Install dependencies for cloned localci runs"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "mise trust",
  "mise install",
  "pnpm --dir web install --frozen-lockfile",
]

[tasks.daemon-start]
description = "Start the localci daemon"
depends = ["//:web-build"]
run = '''
printf 'cwd: %s\n' "$(pwd)"
LOCALCI_WEB_DIR="{{config_root}}/web/dist" go run ./cmd/localci start
'''

[tasks.daemon-restart]
description = "Restart the localci daemon"
depends = ["//:web-build"]
run = '''
printf 'cwd: %s\n' "$(pwd)"
LOCALCI_WEB_DIR="{{config_root}}/web/dist" go run ./cmd/localci restart
'''

[tasks.daemon-stop]
description = "Stop the localci daemon"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "go run ./cmd/localci stop",
]

[tasks.hooks-install]
description = "Install the localci post-commit hook for this repo"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "go run ./cmd/localci install-hooks",
]

[tasks.test]
description = "Run Go tests"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "go test ./...",
]

[tasks.fmt]
description = "Format Go sources"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "gofmt -w ./cmd ./internal",
]

[tasks.format]
description = "Format all sources"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "mise run //...:fmt",
]

[tasks.check]
description = "Run formatting check, tests, and build"
depends = ["//:fmt", "//:test", "//:build"]

[tasks.self-check]
description = "Run localci against this repo and wait for the result"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "go run ./cmd/localci invoke --wait",
]

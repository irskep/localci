experimental_monorepo_root = true

[env]
GOCACHE = "{{config_root}}/.cache/go-build"

[monorepo]
config_roots = ["web"]

[tools]
"aqua:terrastruct/d2" = "0.7.1"
go = "1.26.3"
pnpm = "11.2.2"

[tasks.build]
description = "Build the localci binary"
run = "go build -o ./bin/localci ./cmd/localci"

[tasks.run]
description = "Run localci"
run = "go run ./cmd/localci {{arg(name='args', var=true)}}"

[tasks.postcommit]
description = "Run localci postcommit"
run = "go run ./cmd/localci postcommit {{arg(name='args', var=true)}}"

[tasks.daemon-start]
description = "Start the localci daemon"
run = "go run ./cmd/localci start"

[tasks.daemon-restart]
description = "Restart the localci daemon"
run = "go run ./cmd/localci restart"

[tasks.daemon-stop]
description = "Stop the localci daemon"
run = "go run ./cmd/localci stop"

[tasks.hooks-install]
description = "Install the localci post-commit hook for this repo"
run = "go run ./cmd/localci install-hooks"

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.fmt]
description = "Format Go sources"
run = "gofmt -w ./cmd ./internal"

[tasks.check]
description = "Run formatting check, tests, and build"
depends = ["fmt", "test", "build"]

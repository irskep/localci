[tasks.fmt]
description = "Format Vue sources"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "pnpm exec oxfmt src/",
]

[tasks."localci:build"]
description = "Build the Vue UI"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "pnpm exec vite build --outDir \"$LOCALCI_TASK_OUTPUT_DIR/dist\"",
]

[tasks."localci:fmt"]
description = "Check Vue formatting"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "pnpm exec oxfmt --check src/",
]

[tasks."localci:lint"]
description = "Run Vue lint checks"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "pnpm exec oxlint .",
  "pnpm exec eslint . --max-warnings 0",
]

[tasks."localci:test"]
description = "Run Vue unit tests"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "pnpm exec vitest --run",
]

[tasks."localci:typecheck"]
description = "Run Vue type checking"
run = [
  "printf 'cwd: %s\\n' \"$(pwd)\"",
  "pnpm exec vue-tsc --build",
]
